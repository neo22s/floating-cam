name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          chmod +x test.sh
          ./test.sh

      - name: Build universal app
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x build.sh
          ./build.sh --universal

      - name: Verify bundle
        run: |
          plutil -lint Info.plist
          codesign --verify --deep --strict build/FloatingCamera.app

      - name: Package
        run: ditto -c -k --keepParent build/FloatingCamera.app FloatingCamera.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatingCamera
          path: FloatingCamera.zip

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$APP_VERSION" != "$TAG_VERSION" ]]; then
            echo "Info.plist version $APP_VERSION does not match tag $TAG_VERSION"
            exit 1
          fi

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" FloatingCamera.zip \
            --title "Floating Camera $GITHUB_REF_NAME" \
            --generate-notes
